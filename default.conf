server {
    listen 80;
    server_name localhost;

    # Root directory containing the index.html and other assets
    root /usr/share/nginx/html;
    index index.html index.htm;

    # Enable Gzip compression for faster loading times
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Common security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Healthcheck endpoint for container orchestrators
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    # Handle standard routing and fallbacks
    location / {
        try_files $uri $uri/ =404;
    }

    # Cache static assets aggressively (1 year) since they don't change often
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|svg|webp|woff|woff2|ttf|otf)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # Custom 404 page redirecting to main landing page (or custom page if added)
    error_page 404 /index.html;
}
